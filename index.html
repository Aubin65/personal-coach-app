<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Coach</title>
<meta name="theme-color" content="#0B3D2C">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coach">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Login screen: shown until a GitHub token is stored -->
<div id="login-screen" class="screen">
  <div class="login-card">
    <h1>🏉 Personal Coach</h1>
    <p class="muted">Colle ton token GitHub (le même que celui utilisé pour les Raccourcis iOS — accès Contents lecture/écriture sur <code>Aubin65/personal_coach</code>).</p>
    <input id="token-input" type="password" placeholder="github_pat_..." autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button id="login-button" class="primary-button">Se connecter</button>
    <p id="login-error" class="error-text" hidden></p>
    <p class="muted small">Le token reste uniquement sur ce téléphone (stocké localement) — jamais envoyé ailleurs qu'à l'API GitHub.</p>
  </div>
</div>

<!-- Main app shell -->
<div id="app" class="screen" hidden>
  <header class="topbar">
    <div class="topbar-leading">
      <button id="topbar-back" class="icon-button" title="Retour" aria-label="Retour" hidden>◀</button>
      <div class="topbar-titles">
        <span id="topbar-title">Aujourd'hui</span>
        <span id="topbar-sync-status" class="topbar-sync-status"></span>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="push-subscribe-button" class="icon-button" title="Activer les notifications" aria-label="Activer les notifications" hidden>🔔</button>
      <button id="refresh-button" class="icon-button" title="Rafraîchir" aria-label="Rafraîchir">⟳</button>
    </div>
  </header>

  <main id="content"></main>

  <nav class="bottom-nav">
    <button class="nav-item active" data-view="today">
      <span class="nav-icon">🏠</span><span>Aujourd'hui</span>
    </button>
    <button class="nav-item" data-view="week">
      <span class="nav-icon">📅</span><span>Semaine</span>
    </button>
    <button class="nav-item" data-view="forge">
      <span class="nav-icon">🔨</span><span>Forge</span>
    </button>
    <button class="nav-item" data-view="data">
      <span class="nav-icon">📊</span><span>Data</span>
    </button>
    <button class="nav-item" data-view="calendar">
      <span class="nav-icon">🏉</span><span>Matchs</span>
    </button>
    <button class="nav-item" data-view="chat">
      <span class="nav-icon">💬</span><span>Coach</span>
    </button>
  </nav>
</div>

<!-- Templates for each screen's content, cloned into #content -->
<template id="tpl-skeleton">
  <div class="skeleton skeleton-line w-40"></div>
  <div class="skeleton skeleton-line w-80"></div>
  <div class="skeleton skeleton-line w-60"></div>
</template>

<template id="tpl-today">
  <div id="injury-zone"></div>

  <section class="credo-card">
    <p id="credo-text" class="credo-text"></p>
    <p id="credo-source" class="credo-source"></p>
  </section>

  <button type="button" id="adjust-week-cta" class="cta-banner">
    <span class="cta-icon">🗣️</span>
    <span class="cta-text"><strong>Ajuster ma semaine</strong><br>Parle à ton coach, il propose un ajustement à valider</span>
    <span class="cta-arrow">→</span>
  </button>

  <div class="big-action-grid" id="today-quick-actions">
    <button type="button" class="big-action-card log-session" data-action="session">
      <span class="big-action-icon">📝</span>
      <span class="big-action-label">Loguer la<br>séance</span>
    </button>
    <button type="button" class="big-action-card write-note" data-action="write-note">
      <span class="big-action-icon">🎙️</span>
      <span class="big-action-label">Note<br>vocale</span>
    </button>
  </div>

  <div class="digest-header">
    <h2 id="today-digest-date">Digest</h2>
    <button type="button" id="generate-digest-button" class="primary-button ghost small">🔄 Nouveau digest</button>
  </div>
  <p id="generate-digest-status" class="muted small"></p>
  <div id="today-digest-content" class="markdown-body"></div>
</template>

<template id="tpl-week">
  <div id="week-pending-session-adjustments"></div>

  <div class="segmented" id="week-tabs">
    <button class="segment active" data-week-tab="planning">Planning</button>
    <button class="segment" data-week-tab="block">Bloc</button>
    <button class="segment" data-week-tab="sessions">Séances</button>
    <button class="segment" data-week-tab="history">Historique</button>
  </div>

  <div id="week-planning-panel">
    <div id="pending-proposal"></div>
    <div class="forge-week-nav">
      <button type="button" id="planning-prev-week" class="icon-button small" aria-label="Semaine précédente">◀</button>
      <span id="planning-week-label" class="forge-week-label"></span>
      <button type="button" id="planning-next-week" class="icon-button small" aria-label="Semaine suivante">▶</button>
    </div>
    <div id="week-day-strip"></div>
    <div id="day-overview-panel"></div>
    <div id="week-active-alerts"></div>
    <div id="week-highlights"></div>
    <section class="card">
      <button class="primary-button ghost small" id="adjust-week-button">✏️ Ajuster ma semaine</button>
    </section>
  </div>

  <section class="card" id="week-block-content" hidden>
    <div class="markdown-body"></div>
  </section>

  <section class="card" id="week-sessions-content" hidden></section>

  <div id="week-history-panel" hidden>
    <section class="card">
      <h2>Plannings précédents</h2>
      <div id="history-plans-list"></div>
    </section>
    <section class="card">
      <h2>Séances précédentes</h2>
      <div class="forge-week-nav">
        <button type="button" id="history-prev-week" class="icon-button small" aria-label="Semaine précédente">◀</button>
        <span id="history-week-label" class="forge-week-label"></span>
        <button type="button" id="history-next-week" class="icon-button small" aria-label="Semaine suivante">▶</button>
      </div>
      <input type="date" id="history-jump-date" aria-label="Aller à une semaine">
      <div id="history-sessions-list" style="margin-top:10px"></div>
    </section>
    <div class="git-history-note">
      <span>🔒</span>
      <span>Chaque version de ton planning, bloc, séances et notes est conservée pour toujours (historique Git) — un ajustement ne remplace jamais silencieusement ce qu'il y avait avant.</span>
    </div>
  </div>
</template>

<template id="tpl-forge">
  <section class="card">
    <button type="button" id="forge-block-toggle" class="details-toggle">🎯 Objectifs du bloc en cours</button>
    <div id="forge-block-content" class="markdown-body small" hidden></div>
  </section>

  <div class="forge-week-nav">
    <button type="button" id="forge-prev-week" class="icon-button small" aria-label="Semaine précédente">◀</button>
    <span id="forge-week-label" class="forge-week-label"></span>
    <button type="button" id="forge-next-week" class="icon-button small" aria-label="Semaine suivante">▶</button>
  </div>

  <div id="forge-skeleton-pending"></div>

  <button type="button" id="forge-skeleton-button" class="primary-button ghost small" style="margin-bottom:4px">🧠 Demander un squelette IA</button>
  <p id="forge-skeleton-status" class="muted small" style="margin-bottom:10px"></p>

  <p class="muted small">Icônes = poser juste le type du jour (structure rapide) ; le bloc ouvre le détail complet.</p>
  <div id="forge-days"></div>
</template>

<template id="tpl-data">
  <div id="data-content"></div>
</template>

<template id="tpl-calendar">
  <div id="calendar-content"></div>
</template>

<template id="tpl-chat">
  <div class="chat-log" id="chat-log"></div>
  <form class="chat-input-row" id="chat-form">
    <input id="chat-input" type="text" placeholder="Une question pour le coach…" autocomplete="off">
    <button type="submit" class="primary-button small">Envoyer</button>
  </form>
</template>

<template id="tpl-session">
  <div id="session-content"></div>
</template>

<template id="tpl-write-note">
  <section class="card">
    <h2>Nouvelle note</h2>
    <div class="compose-row">
      <textarea id="note-text" rows="5" placeholder="Ressenti, feedback de séance/match, repas…"></textarea>
      <button type="button" id="note-mic" class="mic-button" title="Dicter" aria-label="Dicter">🎙️</button>
    </div>
    <p class="voice-hint" id="note-voice-hint" hidden></p>
    <p class="live-caption" id="note-live-caption" hidden></p>
    <button id="note-save" class="primary-button" style="margin-top:10px">Enregistrer</button>
    <p id="note-status" class="muted small"></p>
  </section>
  <section class="card">
    <h2>Notes récentes</h2>
    <div id="recent-notes"></div>
  </section>
</template>

<template id="tpl-adjust-week">
  <section class="card">
    <h2>Ajuster ma semaine</h2>
    <p class="muted small">Décris ce que tu veux changer — le coach reconstruit le planning en conséquence (pas juste un remplacement mécanique).</p>
    <div class="compose-row">
      <textarea id="adjust-text" rows="4" placeholder="Ex : j'ai un empêchement jeudi, décale la séance…"></textarea>
      <button type="button" id="adjust-mic" class="mic-button" title="Dicter" aria-label="Dicter">🎙️</button>
    </div>
    <p class="voice-hint" id="adjust-voice-hint" hidden></p>
    <p class="live-caption" id="adjust-live-caption" hidden></p>
    <div id="adjust-suggestions" class="suggestion-chips"></div>
    <button id="adjust-send" class="primary-button" style="margin-top:12px">Envoyer au coach</button>
    <p id="adjust-status" class="muted small"></p>
  </section>
</template>

<script type="module" src="js/main.js"></script>
</body>
</html>
