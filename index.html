<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Coach</title>
<meta name="theme-color" content="#0B3D2C">
<script>try{var t=localStorage.getItem("coach_theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coach">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Archivo+Narrow:wght@500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Login screen: shown until a GitHub token is stored -->
<div id="login-screen" class="screen">
  <div class="login-card">
    <img src="icons/icon-192.png" class="login-logo" alt="" width="72" height="72">
    <h1>Personal Coach</h1>
    <p class="muted">Colle ton token GitHub (le même que celui utilisé pour les Raccourcis iOS — accès Contents lecture/écriture sur <code>Aubin65/personal_coach</code>).</p>
    <input id="token-input" type="password" placeholder="github_pat_..." autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button id="login-button" class="primary-button">Se connecter</button>
    <p id="login-error" class="error-text" hidden></p>
    <p class="muted small">Le token reste uniquement sur ce téléphone (stocké localement) — jamais envoyé ailleurs qu'à l'API GitHub.</p>
  </div>
</div>

<!-- Main app shell -->
<div id="app" class="screen" hidden>
  <header class="topbar">
    <div class="topbar-leading">
      <button id="topbar-back" class="icon-button" title="Retour" aria-label="Retour" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
      <div class="topbar-titles">
        <span id="topbar-title">Aujourd'hui</span>
        <span id="topbar-sync-status" class="topbar-sync-status"></span>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="push-subscribe-button" class="icon-button" title="Activer les notifications" aria-label="Activer les notifications" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/></svg></button>
      <button id="settings-button" class="icon-button" title="Réglages" aria-label="Réglages"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
      <button id="refresh-button" class="icon-button" title="Rafraîchir" aria-label="Rafraîchir"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button>
    </div>
  </header>

  <div id="queue-banner" class="queue-banner" hidden></div>

  <!-- Sous-navigation de l'onglet Plan (Semaine / Bloc / Matchs /
       Historique, maquette C — docs/adr/0077) ; la Forge s'ouvre par
       « Modifier » depuis Semaine. Voir aussi docs/adr/0071. -->
  <nav id="plan-switch" class="plan-switch" aria-label="Sections du plan" hidden>
    <button type="button" class="plan-switch-item" data-view="week" data-subtab="planning">Semaine</button>
    <button type="button" class="plan-switch-item" data-view="week" data-subtab="block">Bloc</button>
    <button type="button" class="plan-switch-item" data-view="calendar">Matchs</button>
    <button type="button" class="plan-switch-item" data-view="week" data-subtab="history">Historique</button>
  </nav>

  <main id="content"></main>

  <nav class="bottom-nav" aria-label="Navigation principale">
    <button type="button" class="nav-item active" data-view="today">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Aujourd'hui</span>
    </button>
    <button type="button" class="nav-item" data-view="week">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Plan</span>
    </button>
    <button type="button" class="nav-fab" id="nav-add-button" aria-label="Ajouter : séance, note, douleur, check-in…">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button type="button" class="nav-item" data-view="data">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg><span>Progrès</span>
    </button>
    <button type="button" class="nav-item" data-view="chat">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg><span>Coach</span>
    </button>
  </nav>
</div>

<!-- Templates for each screen's content, cloned into #content -->
<template id="tpl-skeleton">
  <div class="skeleton skeleton-line w-40"></div>
  <div class="skeleton skeleton-line w-80"></div>
  <div class="skeleton skeleton-line w-60"></div>
</template>

<template id="tpl-today">
  <!-- Citation en grand tout en haut (retour direct, docs/adr/0079), puis
       ordre de l'ADR-0072 (allégé par l'ADR-0089) : « est-ce que je peux y aller ? » (forme),
       check-in, séance du jour, ce qui attend une action (alertes, charge à
       saisir), puis le digest. Les saisies vivent dans le bouton + (ADR-0071). -->
  <section class="credo-card">
    <p id="credo-text" class="credo-text"></p>
    <p id="credo-source" class="credo-source"></p>
  </section>

  <div id="today-readiness"></div>

  <div id="today-session"></div>

  <!-- Fiche de ressenti du match récent (docs/adr/0094), vide sinon. -->
  <div id="today-match-feel"></div>

  <div id="today-todo"></div>

  <section class="card digest-card">
    <div class="digest-header">
      <h2 id="today-digest-date">Le mot du coach</h2>
      <button type="button" id="generate-digest-button" class="soft-icon-button" title="Nouveau digest" aria-label="Générer un nouveau digest"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button>
    </div>
    <p id="generate-digest-status" class="muted small"></p>
    <div id="today-digest-content" class="markdown-body"></div>
    <button type="button" id="digest-expand" class="digest-expand" hidden>Lire le digest complet</button>
  </section>

  <!-- Intendance regroupée en bas, dans une seule carte à lignes repliées
       (ADR-0089) : données reçues, check-in fait, état du système. Un point
       à régler (données manquantes) ou un check-in à faire remonte sous la
       forme (today.js / today-data-check.js). -->
  <div class="today-admin">
    <div id="today-data-check"></div>
    <div id="checkin-content"></div>
    <div id="system-status"></div>
  </div>
</template>

<template id="tpl-settings">
  <!-- Paramètres (docs/adr/0096) — settings.js. -->
  <div id="settings-root"></div>
</template>

<template id="tpl-week">
  <div id="week-pending-session-adjustments"></div>

  <!-- Sous-onglets pilotés par #plan-switch (docs/adr/0077) ; gardés en
       DOM caché pour que renderWeek garde un seul mécanisme d'onglets. -->
  <div class="segmented" id="week-tabs" hidden>
    <button class="segment active" data-week-tab="planning">Planning</button>
    <button class="segment" data-week-tab="block">Bloc</button>
    <button class="segment" data-week-tab="history">Historique</button>
  </div>

  <div id="week-planning-panel">
    <div id="pending-proposal"></div>
    <div class="week-nav">
      <button type="button" id="planning-prev-week" class="icon-button small" aria-label="Semaine précédente"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
      <div class="week-nav-text"><span id="planning-week-label" class="week-nav-title"></span><span id="planning-week-sub" class="week-nav-sub"></span></div>
      <button type="button" id="planning-next-week" class="icon-button small" aria-label="Semaine suivante"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <button type="button" id="week-edit-button" class="week-edit-button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>Modifier cette semaine (Forge)</button>
    <div id="week-day-strip"></div>
    <div id="day-overview-panel"></div>
    <div id="week-highlights"></div>
    <details class="card week-sessions-details">
      <summary>Prévu / réalisé, jour par jour</summary>
      <div id="week-sessions-content"></div>
    </details>
    <button type="button" class="week-adjust-button" id="adjust-week-button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>Demander un ajustement au coach</button>
  </div>

  <!-- Plan › Bloc (docs/adr/0093) : choix du bloc, statut, sections mises en page — block-view.js. -->
  <div id="week-block-content" hidden></div>


  <div id="week-history-panel" hidden>
    <section class="card">
      <h2>Plannings précédents</h2>
      <div id="history-plans-list"></div>
    </section>
    <section class="card">
      <h2>Séances précédentes</h2>
      <div class="forge-week-nav">
        <button type="button" id="history-prev-week" class="icon-button small" aria-label="Semaine précédente"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
        <span id="history-week-label" class="forge-week-label"></span>
        <button type="button" id="history-next-week" class="icon-button small" aria-label="Semaine suivante"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
      <input type="date" id="history-jump-date" aria-label="Aller à une semaine">
      <div id="history-sessions-list" style="margin-top:10px"></div>
    </section>
    <div class="git-history-note">
      <span>🔒</span>
      <span>Chaque version de ton planning, bloc, séances et notes est conservée pour toujours (historique Git) — un ajustement ne remplace jamais silencieusement ce qu'il y avait avant.</span>
    </div>
  </div>
</template>

<template id="tpl-forge-bloc">
  <div id="forge-bloc-root"></div>
</template>

<template id="tpl-forge">
  <section class="card">
    <button type="button" id="forge-block-toggle" class="details-toggle">🎯 Objectifs du bloc en cours</button>
    <div id="forge-block-content" class="markdown-body small" hidden></div>
  </section>

  <section class="card club-days-card">
    <p class="small"><strong>🏉 Entraînements club</strong> <span class="muted">— jours habituels</span></p>
    <div id="club-days" class="bloc-chips"></div>
    <p class="muted small" id="club-days-hint">Annulation ou déplacement : pose « Repos » sur le jour, et « Rugby » sur le nouveau, avec les icônes ci-dessous.</p>
  </section>

  <button type="button" id="forge-bloc-button" class="primary-button ghost small" style="margin-bottom:10px">🎯 Forge de bloc — objectifs et discussion</button>

  <div class="forge-week-nav">
    <button type="button" id="forge-prev-week" class="icon-button small" aria-label="Semaine précédente"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
    <span id="forge-week-label" class="forge-week-label"></span>
    <button type="button" id="forge-next-week" class="icon-button small" aria-label="Semaine suivante"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>

  <div id="forge-skeleton-pending"></div>

  <button type="button" id="forge-skeleton-button" class="primary-button ghost small" style="margin-bottom:4px">🧠 Demander un squelette IA</button>
  <p id="forge-skeleton-status" class="muted small" style="margin-bottom:10px"></p>

  <p class="muted small">Icônes = poser juste le type du jour (structure rapide) ; le bloc ouvre le détail complet.</p>
  <div id="forge-days"></div>
</template>

<template id="tpl-data">
  <div id="data-content"></div>
</template>

<template id="tpl-calendar">
  <div id="calendar-content"></div>
</template>

<template id="tpl-chat">
  <div class="chat-log" id="chat-log"></div>
  <p class="live-caption" id="chat-live-caption" hidden></p>
  <p class="voice-hint" id="chat-voice-hint" hidden></p>
  <div class="chat-suggestions" id="chat-suggestions">
    <button type="button" class="chat-suggestion" data-prompt="Adapte ma séance du jour : ">Adapter ma séance</button>
    <button type="button" class="chat-suggestion" data-prompt="Fais-moi le bilan de ma semaine.">Bilan de la semaine</button>
    <button type="button" class="chat-suggestion" data-prompt="Quel plan de récupération après le match ?">Récup après match</button>
    <button type="button" class="chat-suggestion" data-prompt="Comment je me situe par rapport aux objectifs du bloc ?">Objectifs du bloc</button>
  </div>
  <form class="chat-input-row" id="chat-form">
    <input id="chat-input" type="text" placeholder="Écris ou dicte ta question…" autocomplete="off" aria-label="Message au coach">
    <button type="button" class="mic-button" id="chat-mic" title="Dicter" aria-label="Dicter"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <button type="submit" class="chat-send" aria-label="Envoyer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </form>
  <p id="chat-status" class="muted small" hidden></p>
</template>

<template id="tpl-session">
  <div id="session-content"></div>
</template>

<template id="tpl-write-note">
  <section class="card">
    <h2>Nouvelle note</h2>
    <div class="compose-row">
      <textarea id="note-text" rows="5" placeholder="Ressenti, feedback de séance/match, repas…"></textarea>
      <button type="button" id="note-mic" class="mic-button" title="Dicter" aria-label="Dicter"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    </div>
    <p class="voice-hint" id="note-voice-hint" hidden></p>
    <p class="live-caption" id="note-live-caption" hidden></p>
    <button id="note-save" class="primary-button" style="margin-top:10px">Enregistrer</button>
    <p id="note-status" class="muted small"></p>
  </section>
  <section class="card">
    <h2>Notes récentes</h2>
    <div id="recent-notes"></div>
  </section>
</template>

<template id="tpl-adjust-week">
  <section class="card">
    <h2>Ajuster ma semaine</h2>
    <p class="muted small">Décris ce que tu veux changer — le coach reconstruit le planning en conséquence (pas juste un remplacement mécanique).</p>
    <div class="compose-row">
      <textarea id="adjust-text" rows="4" placeholder="Ex : j'ai un empêchement jeudi, décale la séance…"></textarea>
      <button type="button" id="adjust-mic" class="mic-button" title="Dicter" aria-label="Dicter"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    </div>
    <p class="voice-hint" id="adjust-voice-hint" hidden></p>
    <p class="live-caption" id="adjust-live-caption" hidden></p>
    <div id="adjust-suggestions" class="suggestion-chips"></div>
    <button id="adjust-send" class="primary-button" style="margin-top:12px">Envoyer au coach</button>
    <p id="adjust-status" class="muted small"></p>
  </section>
</template>

<template id="tpl-pain">
  <section class="card">
    <h2>Douleur / gêne</h2>
    <p class="pain-q">Où ?</p>
    <div id="pain-zone-chips" class="suggestion-chips"></div>
    <div id="pain-side-toggle" class="suggestion-chips" hidden></div>
    <div class="pain-level-head"><span class="pain-level-title">Niveau</span><span id="pain-level-label" class="pain-level-label">touche un chiffre</span></div>
    <div id="pain-level-grid" class="pain-level-grid" role="group" aria-label="Niveau de douleur de 0 à 10"></div>
    <input type="hidden" id="pain-level">
    <label for="pain-date">Date</label>
    <input type="date" id="pain-date">
    <div class="compose-row" style="margin-top:10px">
      <textarea id="pain-note" rows="3" placeholder="Contexte : après quel exercice/mouvement, ce qui a aidé…"></textarea>
      <button type="button" id="pain-mic" class="mic-button" title="Dicter" aria-label="Dicter"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    </div>
    <p class="voice-hint" id="pain-voice-hint" hidden></p>
    <p class="live-caption" id="pain-live-caption" hidden></p>
    <button id="pain-save" class="primary-button" style="margin-top:10px">Enregistrer</button>
    <p id="pain-status" class="muted small"></p>
  </section>
  <section class="card">
    <h2>Historique</h2>
    <div id="pain-history-filters" class="suggestion-chips"></div>
    <div id="pain-history-list"></div>
  </section>
</template>

<script type="module" src="js/main.js"></script>
</body>
</html>
